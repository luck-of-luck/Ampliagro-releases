# assinado digitalmente. electron-builder usa a variÃ¡vel CSC_LINK para
# encontrar o certificado (.pfx) e CSC_KEY_PASSWORD para a senha.
#
# CONFIGURAÃ‡ÃƒO NO GITHUB ACTIONS:
# 1. Obtenha um certificado de assinatura de cÃ³digo (EV Certificate):
#    - GrÃ¡tis: Microsoft IDEA Developer Program (https://dev.microsoft.com/idea)
#    - Pago: DigiCert, GlobalSign, Sectigo, Comodo (~R$ 100-500/ano)
# 2. Codifique o .pfx em base64:
#    [Convert]::ToBase64String([IO.File]::ReadAllBytes("caminho/cert.pfx"))
# 3. Crie secrets no repositÃ³rio:
#    - CODE_SIGN_CERTIFICATE: conteÃºdo base64 do .pfx
