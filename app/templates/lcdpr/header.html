<header class="lcdpr-header">
    <div class="lcdpr-header-content">
        <div class="lcdpr-logo-section">
            <svg class="lcdpr-logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="32" height="32" rx="6" fill="var(--cor-primaria)"/>
                <path d="M8 12h16M8 16h12M8 20h16" stroke="white" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <div class="lcdpr-title-group">
                <h1 class="lcdpr-title">LCDPR</h1>
                <span class="lcdpr-subtitle">Livro Caixa Digital do Produtor Rural</span>
            </div>
            <span class="lcdpr-version-badge">Leiaute 1.3</span>
        </div>
        <div class="lcdpr-header-actions">
            <a href="{% url 'index_spa' %}" class="lcdpr-btn lcdpr-btn--ghost">Dashboard</a>
            <a href="{% url 'central-gestao' %}" class="lcdpr-btn lcdpr-btn--primary">Central de Gestão</a>
        </div>
    </div>
    <nav class="lcdpr-nav" aria-label="Navegação LCDPR">
        <div class="lcdpr-nav-scroll">
            <a href="/api/financeiro/lcdpr/download/" class="lcdpr-nav-item {% if request.path == '/api/financeiro/lcdpr/download/' %}active{% endif %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/></svg>
                <span>Baixar LCDPR</span>
            </a>
            <a href="/financeiro/" class="lcdpr-nav-item {% if request.path == '/financeiro/' %}active{% endif %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                <span>Financeiro</span>
            </a>
            <a href="/custos/" class="lcdpr-nav-item {% if request.path == '/custos/' %}active{% endif %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M12 22v-10"/></svg>
                <span>Custos</span>
            </a>
            <a href="/cadastro/safra/" class="lcdpr-nav-item {% if request.path == '/cadastro/safra/' %}active{% endif %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/></svg>
                <span>Safras</span>
            </a>
            <a href="/central-gestao/" class="lcdpr-nav-item {% if request.path == '/central-gestao/' %}active{% endif %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
                <span>Central de Gestão</span>
            </a>
        </div>
    </nav>
</header>
