<div id="confirm-modal" class="hidden fixed inset-0 z-[9998] items-center justify-center bg-black/60" style="display:none;">
    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-2xl max-w-sm w-full mx-3 p-6 border border-slate-200 dark:border-slate-700">
        <div class="text-center">
            <div class="w-12 h-12 mx-auto mb-3 rounded-full bg-red-100 dark:bg-red-900/30 flex items-center justify-center">
                <i class="bi bi-exclamation-triangle text-red-500 text-xl"></i>
            </div>
            <p class="confirm-message text-sm text-slate-700 dark:text-slate-300 font-medium mb-5">Tem certeza?</p>
            <div class="flex gap-3 justify-center">
                <button class="confirm-no btn-secondary px-4 py-2 text-sm">Cancelar</button>
                <button class="confirm-yes btn-danger px-4 py-2 text-sm">Confirmar</button>
            </div>
        </div>
    </div>
</div>
