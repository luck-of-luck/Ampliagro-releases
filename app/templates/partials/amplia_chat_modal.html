<!-- AmplIA Chat Modal (legado — o chat ativo é o ia-dock; este modal só abre via JS) -->
<div id="amplia-portal-modal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-end">
    <div class="bg-white dark:bg-ncs-blue-dark h-full w-96 max-w-sm flex flex-col">
        <div class="flex items-center justify-between p-4 border-b border-slate-200 dark:border-slate-700">
            <h3 class="font-bold flex items-center gap-2">
                <i class="bi bi-robot text-purple-600"></i>
                AmplIA
            </h3>
            <button onclick="closeAmpliaPortal()" class="w-8 h-8 rounded hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-center">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
        <div id="amplia-chat-messages" class="flex-1 p-4 overflow-y-auto text-xs space-y-3">
            <div class="bg-purple-100 dark:bg-purple-900/30 p-3 rounded-lg max-w-[80%]">
                <p class="text-slate-700 dark:text-slate-300">Olá! Como posso ajudar com sua análise agrícola?</p>
            </div>
        </div>
        <div class="p-3 border-t border-slate-200 dark:border-slate-700">
            <div class="flex gap-2">
                <input type="text" id="amplia-input" placeholder="Digite seu comando..." class="flex-1 px-3 py-2 text-xs border rounded-lg bg-white dark:bg-ncs-blue-dark/50" onkeyup="if(event.key==='Enter') sendAmpliaMessage()">
                <button onclick="sendAmpliaMessage()" class="w-10 h-10 rounded-lg bg-purple-500 hover:bg-purple-600 text-white flex items-center justify-center">
                    <i class="bi bi-send"></i>
                </button>
            </div>
        </div>
    </div>
</div>
