[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
# Patterns de ARQUIVO (basename), nao de caminho. `tests/*.py`/`tests/**/*.py`
# nao casavam com app/ia/tests_palco.py — o pytest compara o nome do arquivo,
# a nao menos que o pattern traga separador. Resultado: app/**/tests*.py
# (boa parte da suite) saia da coleta sem nenhum aviso.
python_files = test_*.py tests_*.py tests.py
python_classes = Test*
python_functions = test_*
# tests/ (suite principal) roda antes de app/.
testpaths = tests app
# Sem isto o pytest varre scratch/, scripts/, logs/ e encontra test_out.txt /
# test_stash.txt: o doctest coleta qualquer test*.txt por padrao (doctestglob)
# e aborta a suite inteira com UnicodeDecodeError (esses arquivos sao UTF-16).
norecursedirs = _backups backups scratch scripts docs node_modules .venv staticfiles htmlcov grafos graphify-out playwright-report logs media .git .idea .opencode .hermes
addopts = --tb=short -q --cov=app --cov-report=html --cov-report=term-missing
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    keep_cache: o teste mede o comportamento do cache e nao pode ser limpo pela fixture `limpar_cache_entre_testes`. Usar apenas onde o cache e' o objecto do teste.
